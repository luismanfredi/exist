[project]
name = "exist"
version = "0.1.0"
description = "A multiclass classifier for celestial objects built with scikit-learn."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Luís Antonio Manfredi Sodré", email = "luismanfredi920@gmail.com"}
]
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "jupyter-core>=5.9.1",
    "matplotlib>=3.11.1",
    "notebook>=7.6.2",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pyprojroot>=0.3.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "types-seaborn>=0.13.2.20260728",
    "uvicorn[standard]>=0.53.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
]

[tool.mypy]
mypy_path = "src:tests"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "joblib.*"
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exist"]
